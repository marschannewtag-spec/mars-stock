# =============================================================
# deploy-worker.yml — worker/ 有改動就自動部署到 Cloudflare
# -------------------------------------------------------------
# 治的病:git push 只更新 GitHub Pages 上的前端,碰不到 Cloudflare 上的
# Worker。以前每次改 Worker 都得記得另外去儀表板重貼一次 —— 忘了的話
# 前端是新的、Worker 是舊的,而且完全沒有錯誤訊息。
#
# 需要兩個 GitHub secret(Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   權限用 "Edit Cloudflare Workers" 範本
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 儀表板右側可以找到
#
# 這兩個由你自己加,我看不到也不需要看到。
#
# 沒設 secret 時這支 workflow 會失敗 —— 這是刻意的,失敗比「靜靜地
# 什麼都沒做」好:你會知道 Worker 沒有被部署。
# =============================================================
name: deploy-worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:        # 想手動重新部署時用

# 同時只跑一個部署,避免兩次 push 互相覆蓋
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # secret 沒設時,wrangler 只會丟一句
      # 「The process '/opt/.../npx' failed with exit code 1」,完全看不出原因。
      # 先自己檢查一次,把它變成看得懂的錯誤。
      - name: 確認 Cloudflare secret 有設
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$ACCOUNT" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::缺少 GitHub secret:$missing"
            echo "到 repo 的 Settings -> Secrets and variables -> Actions 新增。"
            echo "token 在 https://dash.cloudflare.com/profile/api-tokens"
            echo "用 'Edit Cloudflare Workers' 範本建立。"
            exit 1
          fi
          echo "兩個 secret 都已設定"

      # 先驗過再部署 —— 語法壞掉的 Worker 不該上線
      - name: 部署前驗證
        run: node scripts/verify.mjs

      - name: 部署到 Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 部署完立刻驗四個端點還活著、CORS 有正確鎖住。
      # 部署「成功」不等於「還能用」—— 這一步才是真正的驗收。
      - name: 部署後驗證
        env:
          WORKER_URL: https://stock.marschannewtag.workers.dev
          SITE_ORIGIN: https://marschannewtag-spec.github.io
        run: node scripts/check-worker.mjs
