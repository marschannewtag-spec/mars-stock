# =============================================================
# data-source-check.yml — 每週自動檢查三個外部資料源還活著
# -------------------------------------------------------------
# 為什麼是每週不是每年:
#   FMP 停用過 legacy 的 v3/gainers 端點,是壞掉之後才發現的。
#   外部 API 變更不會通知你,而年度健檢一年才一次 —— 中間壞掉的話
#   你要到隔年才知道。每週檢查把「發現壞掉」的延遲從一年壓到七天。
#
# 失敗時 GitHub 會寄信給 repo 擁有者,這就是通知機制。
#
# ⚠️ GitHub 的排程 workflow 在 repo 連續 60 天沒有活動後會被自動停用。
#    這不是理論:2026-10-12 真的收到警告信(最後一個 commit 是 08-19,第 54 天)。
#    計時器靠「push commit」歸零;被關掉之後要去 Actions 頁手動按 Enable workflow。
#    別用機器人推空 commit 去繞過它 —— 自動停用其實是個 dead man's switch:
#    真的 60 天沒碰這個 repo,你也不會在看它的失敗通知。讓它提醒你回來。
# =============================================================
name: data-source-check

on:
  schedule:
    # 挑週一是因為此時最新的日線是上週五收盤(3 天前),
    # 還在「新鮮度警告」的門檻(5 天)之內,不會誤報。
    #
    # ⚠️ 寫 02:00 UTC,但**不會準時在 02:00 跑**。GitHub 的排程器在尖峰時段
    #    會延遲(官方文件有寫),實測 2026-09~10 的四次都落在 07:37~08:36 UTC,
    #    也就是台北時間週一**下午 4 點半**左右,穩定遲到 5.5~6.5 小時。
    #    這不影響上面挑週一的理由(遲到 6 小時仍在 5 天門檻內),
    #    但別拿這個 cron 當「準時」的東西用,也別照字面相信「早上 10 點」。
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 檢查 Worker 四個端點 + CORS 設定
        env:
          WORKER_URL: https://stock.marschannewtag.workers.dev
          SITE_ORIGIN: https://marschannewtag-spec.github.io
        run: node scripts/check-worker.mjs
